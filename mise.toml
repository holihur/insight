[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "12.15.0"

[env]
GOPROXY = "https://goproxy.cn,direct"
GOSUMDB = "sum.golang.google.cn"
GOFLAGS = "-mod=mod"

[tasks.install]
description = "Install backend and frontend dependencies"
run = """
cd backend && go mod download
cd ../frontend && pnpm install
"""

[tasks.dev]
description = "Run backend (:8080) and frontend (:5173) together"
run = "bash scripts/dev.sh"

[tasks.build]
description = "Build the Go server and the React frontend"
run = """
cd frontend && pnpm build
cd ../backend && go build -trimpath -ldflags "-s -w" -o ../bin/code-insight ./cmd/server
"""

[tasks.start]
description = "Build and start the production server on :8080"
depends = ["build"]
run = "./bin/code-insight"

[tasks.check]
description = "Run Go vet and TypeScript checks"
run = """
cd backend && go vet ./...
cd ../frontend && pnpm typecheck
"""
